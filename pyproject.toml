[project]
name = "video-person-tracking"
version = "0.1.0"
description = "Grounding DINO and SAM 2.1 person tracking for HQ-OpenHumanVid"
requires-python = ">=3.10,<3.13"
dependencies = [
    "decord>=0.6,<1",
    "numpy>=1.24,<2",
    "Pillow>=10",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "transformers>=4.50,<4.51",
    "sam-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu121", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
